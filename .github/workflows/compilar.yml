name: Compilar Proyecto Rust y Vue

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. Descarga el código del repositorio
    - name: Descargar codigo
      uses: actions/checkout@v4

    # 2. Configura Node.js versión 24 para evitar la advertencia de obsolescencia
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    # 3. Configura las herramientas de Rust
    - name: Configurar Rust
      uses: dtolnay/rust-toolchain@stable

    # 4. Instala dependencias y compila el frontend de Vue
    - name: Instalar dependencias y compilar Frontend
      run: |
        npm install
        npm run build

    # 5. Compila el ejecutable de Rust
    - name: Compilar ejecutable Rust
      run: |
        cargo build --release

    # 6. Guarda el archivo .exe generado para descargarlo
    - name: Subir archivo EXE generado
      uses: actions/upload-artifact@v4
      with:
        name: ejecutable-windows
        path: target/release/*.exe
